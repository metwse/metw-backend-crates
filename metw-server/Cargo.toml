[package]
name = "metw-server"
version = "0.0.0"
edition = "2024"

[dependencies]
tokio = { workspace = true, features = ["net", "signal"] }
axum = { workspace = true }
tower-http = { workspace = true, features = ["trace"] }
http = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic"], optional = true }
opentelemetry_sdk = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

dotenvy = { workspace = true }

[features]
otel = ["dep:opentelemetry", "dep:tracing-opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk"]
allow-all-cors = ["tower-http/cors"]

[lints]
workspace = true
